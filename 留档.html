<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>四级高频单词 · 背诵</title>
<style>
  :root{
    --blue:#1f5fa8; --gray:#666; --green:#2e8b74; --line:#9a9a9a;
    --bg:#ffffff; --card:#ffffff; --ink:#1a1a1a; --sub:#555;
    --hair:#ececec; --accent:#1f5fa8; --panel:#f4f6f9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1113; --card:#15181b; --ink:#e8e8e8; --sub:#a8adb3;
      --hair:#262a2e; --blue:#7fb0e6; --green:#5cc7ac; --gray:#8a9099;
      --line:#7d7d7d; --panel:#1b1f23; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  /* ---------- top bar ---------- */
  #top{ flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 8px; }
  #top .t{ font-weight:700; font-size:15px; color:var(--blue); }
  #top .sp{ flex:1; }
  .iconbtn{ border:1px solid var(--hair); background:var(--card); color:var(--sub);
    border-radius:9px; padding:6px 11px; font-size:13px; cursor:pointer; }

  /* ---------- pages ---------- */
  #pages{ flex:1 1 auto; position:relative; }
  #pages.h{ display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  #pages.h .page{ flex:0 0 100%; scroll-snap-align:start; height:100%;
    overflow:hidden; }
  #pages.v{ display:block; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; }
  #pages.v .page{ width:100%; }

  .page{ padding:6px 12px 14px; }
  .page-inner{ column-gap:22px; column-fill:balance; }
  #pages.h .page-inner{ height:100%; column-fill:auto; }
  @media (min-width:640px){ .page-inner{ column-count:2; } }
  @media (max-width:639px){ .page-inner{ column-count:1; } }

  /* ---------- entry ---------- */
  .entry{ break-inside:avoid; padding:5px 2px 5px 40px; position:relative;
    border-bottom:1px solid var(--hair); }
  .gutter{ position:absolute; left:0; top:0; bottom:0; width:38px;
    display:flex; justify-content:center; padding-top:6px; cursor:pointer; }
  .rank{ font-size:12px; color:var(--gray); font-variant-numeric:tabular-nums; }
  .head{ position:relative; display:inline-block; }
  .hw{ font-size:17px; font-weight:700; color:var(--blue); cursor:pointer;
    letter-spacing:.2px; }
  .ipa{ font-size:11px; color:var(--gray); margin:1px 0 2px; }
  .def{ font-size:13px; line-height:1.45; margin:1px 0; }
  .ex{ font-size:12.5px; line-height:1.5; margin:2px 0; color:var(--sub); }
  .ex b{ color:var(--ink); }
  .root{ margin-top:3px; padding:5px 8px; background:var(--panel);
    border-radius:8px; }
  .root .p{ font-size:12px; line-height:1.55; }
  .root .tag{ display:inline-block; min-width:34px; text-align:center;
    color:#fff; background:var(--green); border-radius:5px; font-size:10px;
    padding:0 5px; margin-right:5px; vertical-align:1px; }
  .root .txt{ font-weight:700; }
  .root .sum{ font-size:12px; line-height:1.55; margin-top:2px; color:var(--green); }

  /* mark: short gray underline at the left, NOT a full strikethrough */
  .entry.marked .gutter::after{ content:""; position:absolute; left:6px;
    top:15px; width:60px; height:2.5px; background:var(--line); border-radius:2px;
    box-shadow:0 3px 0 -1px var(--line); }
  .entry.marked{ opacity:.55; }
  #pages.hideMarked .entry.marked{ display:none; }

  .speaking{ animation:pulse .5s ease; }
  @keyframes pulse{ 0%{ background:rgba(120,170,230,.18);} 100%{ background:transparent; } }

  /* ---------- page bar + wheel ---------- */
  #bar{ flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    gap:6px; padding:6px 12px calc(env(safe-area-inset-bottom) + 6px);
    border-top:1px solid var(--hair); }
  #pageno{ font-size:13px; color:var(--sub); cursor:pointer; padding:4px 14px;
    border:1px solid var(--hair); border-radius:20px; background:var(--card);
    font-variant-numeric:tabular-nums; }

  #wheelH{ position:absolute; left:12px; right:12px; bottom:52px;
    background:var(--card); border:1px solid var(--hair); border-radius:12px;
    padding:10px 14px; display:none; box-shadow:0 6px 24px rgba(0,0,0,.15); }
  #wheelH input{ width:100%; }
  #wheelV{ position:absolute; right:8px; top:12%; bottom:12%; width:44px;
    background:var(--card); border:1px solid var(--hair); border-radius:22px;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 6px 24px rgba(0,0,0,.15); }
  #wheelV input{ writing-mode:vertical-lr; -webkit-appearance:slider-vertical;
    width:20px; height:88%; }
  .wlabel{ text-align:center; font-size:12px; color:var(--sub); margin-bottom:6px;
    font-variant-numeric:tabular-nums; }

  input[type=range]{ accent-color:var(--blue); }

  /* ---------- settings ---------- */
  #settings{ position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; padding:0 22px;
    padding-top:calc(env(safe-area-inset-top) + 20px); overflow:auto; }
  #settings h1{ font-size:24px; color:var(--blue); margin:14px 0 4px; }
  #settings .desc{ color:var(--sub); font-size:13px; margin-bottom:18px; }
  .row{ display:flex; align-items:center; padding:16px 2px;
    border-bottom:1px solid var(--hair); gap:12px; }
  .row .lab{ flex:1; }
  .row .lab b{ font-size:15px; } .row .lab span{ display:block; color:var(--sub);
    font-size:12px; margin-top:2px; }
  .seg{ display:flex; border:1px solid var(--blue); border-radius:9px;
    overflow:hidden; }
  .seg button{ border:0; background:var(--card); color:var(--blue);
    padding:8px 14px; font-size:13px; cursor:pointer; }
  .seg button.on{ background:var(--blue); color:#fff; }
  .switch{ width:52px; height:30px; border-radius:16px; background:#c8ccd2;
    position:relative; cursor:pointer; transition:background .2s; flex:0 0 auto; }
  .switch.on{ background:var(--blue); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:24px;
    height:24px; border-radius:50%; background:#fff; transition:left .2s; }
  .switch.on::after{ left:25px; }
  #start{ margin:26px 0 40px; padding:15px; background:var(--blue); color:#fff;
    border:0; border-radius:13px; font-size:17px; font-weight:700; cursor:pointer; }
  .hintbox{ background:var(--panel); border-radius:10px; padding:12px 14px;
    font-size:12.5px; color:var(--sub); line-height:1.7; margin-top:6px; }
  .hintbox b{ color:var(--ink); }
</style>
</head>
<body>

<div id="settings">
  <h1>四级高频单词 · 背诵</h1>
  <div class="desc">2021–2025 真题 · top 1250 · 含词根词缀</div>

  <div class="row">
    <div class="lab"><b>显示已划掉的单词</b><span>关闭后，已掌握（划线）的单词会被隐藏</span></div>
    <div id="sw-showmarked" class="switch"></div>
  </div>

  <div class="row">
    <div class="lab"><b>翻页方式</b><span>左右滑动分页 / 上下无缝滚动</span></div>
    <div class="seg" id="seg-mode">
      <button data-v="h">左右翻页</button>
      <button data-v="v">上下无缝</button>
    </div>
  </div>

  <div class="row">
    <div class="lab"><b>发音口音</b><span>点击单词区域朗读（有道发音）</span></div>
    <div class="seg" id="seg-accent">
      <button data-v="us">美音</button>
      <button data-v="uk">英音</button>
    </div>
  </div>

  <div class="hintbox">
    <b>操作说明</b><br>
    · 点击左侧<b>序号</b>格 → 灰色划线标记「已掌握」（再点取消）<br>
    · 点击<b>单词</b> → 切换 音节拆分/原词（com·po·si·tion ⇄ composition），同时发音<br>
    · 点击词条<b>其他区域</b> → 发音<br>
    · 点击底部/右侧<b>页码</b> → 弹出快速翻页滚轮<br>
    · 设置、划线、上次位置会自动保存
  </div>

  <button id="start">开始背诵</button>
</div>

<div id="top">
  <div class="t">四级高频 1250</div>
  <div class="sp"></div>
  <button class="iconbtn" id="btn-settings">设置</button>
</div>

<div id="pages"></div>

<div id="wheelH"><div class="wlabel" id="wlabelH"></div><input type="range" id="rangeH"></div>
<div id="wheelV"><input type="range" id="rangeV"></div>

<div id="bar"><div id="pageno">1 / 1</div></div>

<script>
(function(){
  "use strict";
  var DATA = window.CET4 || [];
  var PAGE_SIZE = 22;
  var LS = "cet4_reader_v1";

  var state = {
    showMarked: true,
    mode: "h",           // 'h' | 'v'
    accent: "us",         // 'us' | 'uk'
    marked: {},          // {rank:1}
    page: 0,             // last page (h)
    vscroll: 0           // last scroll ratio (v)
  };
  try{ var saved = JSON.parse(localStorage.getItem(LS)); if(saved) Object.assign(state, saved); }catch(e){}
  function save(){ localStorage.setItem(LS, JSON.stringify(state)); }

  // ---- build pages ----
  var pages = [];
  for(var i=0;i<DATA.length;i+=PAGE_SIZE) pages.push(DATA.slice(i,i+PAGE_SIZE));

  var pagesEl = document.getElementById("pages");
  var pagenoEl = document.getElementById("pageno");

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function entryHTML(e){
    var h = '<div class="entry'+(state.marked[e.rank]?" marked":"")+'" data-rank="'+e.rank+'" data-word="'+esc(e.word)+'">';
    h += '<div class="gutter" data-act="mark"><span class="rank">'+e.rank+'</span></div>';
    h += '<div class="head"><span class="hw" data-act="syl" data-orig="'+esc(e.word)+'" data-syl="'+esc(e.syl||e.word)+'">'+esc(e.word)+'</span></div>';
    if(e.uk||e.us) h += '<div class="ipa">英[/'+esc(e.uk)+'/]&nbsp; 美[/'+esc(e.us)+'/]</div>';
    if(e.def) h += '<div class="def">'+esc(e.def)+'</div>';
    if(e.ex) h += '<div class="ex"><b>'+esc(e.ex_label||"例句")+'</b>：'+esc(e.ex)+'</div>';
    if(e.root && e.root.parts && e.root.parts.length){
      h += '<div class="root">';
      e.root.parts.forEach(function(p){
        h += '<div class="p"><span class="tag">'+esc(p.type)+'</span><span class="txt">'+esc(p.text)+'</span> = '+esc(p.meaning)+'</div>';
      });
      if(e.root.summary) h += '<div class="sum">▸ '+esc(e.root.summary)+'</div>';
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function render(){
    var html = "";
    for(var p=0;p<pages.length;p++){
      html += '<div class="page" data-page="'+p+'"><div class="page-inner">';
      for(var k=0;k<pages[p].length;k++) html += entryHTML(pages[p][k]);
      html += '</div></div>';
    }
    pagesEl.innerHTML = html;
    applyMode();
  }

  function applyMode(){
    pagesEl.className = state.mode + (state.showMarked ? "" : " hideMarked");
    if(state.mode==="h"){
      // restore page
      requestAnimationFrame(function(){
        var pg = pagesEl.querySelector('.page[data-page="'+state.page+'"]');
        if(pg) pagesEl.scrollLeft = pg.offsetLeft;
        updatePageLabel();
      });
    }else{
      requestAnimationFrame(function(){
        pagesEl.scrollTop = state.vscroll * (pagesEl.scrollHeight - pagesEl.clientHeight || 1);
        updatePageLabel();
      });
    }
  }

  // ---- paging label + tracking ----
  function currentPageH(){
    return Math.round(pagesEl.scrollLeft / (pagesEl.clientWidth||1));
  }
  function currentPageV(){
    var ps = pagesEl.querySelectorAll(".page");
    var mid = pagesEl.scrollTop + pagesEl.clientHeight/2;
    for(var i=0;i<ps.length;i++){
      if(ps[i].offsetTop + ps[i].offsetHeight >= mid) return i;
    }
    return ps.length-1;
  }
  function updatePageLabel(){
    var cur = state.mode==="h" ? currentPageH() : currentPageV();
    if(cur<0) cur=0; if(cur>pages.length-1) cur=pages.length-1;
    pagenoEl.textContent = (cur+1) + " / " + pages.length;
    rangeH.value = cur; rangeV.value = cur;
    wlabelH.textContent = "第 " + (cur+1) + " / " + pages.length + " 页";
    return cur;
  }

  var scrollTO;
  pagesEl.addEventListener("scroll", function(){
    var cur = updatePageLabel();
    clearTimeout(scrollTO);
    scrollTO = setTimeout(function(){
      if(state.mode==="h"){ state.page = cur; }
      else { state.vscroll = pagesEl.scrollTop / (pagesEl.scrollHeight - pagesEl.clientHeight || 1); state.page = cur; }
      save();
    }, 180);
  }, {passive:true});

  // ---- audio ----
  var audio = new Audio();
  function speak(word){
    var t = state.accent==="uk" ? 1 : 2;
    audio.src = "https://dict.youdao.com/dictvoice?type="+t+"&audio="+encodeURIComponent(word);
    audio.play().catch(function(){});
  }
  function flash(el){ el.classList.remove("speaking"); void el.offsetWidth; el.classList.add("speaking"); }

  // ---- interactions ----
  pagesEl.addEventListener("click", function(ev){
    var entry = ev.target.closest(".entry"); if(!entry) return;
    var rank = +entry.dataset.rank;
    var word = entry.dataset.word;
    var actEl = ev.target.closest("[data-act]");
    var act = actEl ? actEl.dataset.act : "speak";

    if(act==="mark"){
      if(state.marked[rank]) delete state.marked[rank]; else state.marked[rank]=1;
      entry.classList.toggle("marked");
      save();
      return;
    }
    if(act==="syl"){
      var hw = actEl;
      var showing = hw.dataset.showing==="syl";
      hw.textContent = showing ? hw.dataset.orig : hw.dataset.syl;
      hw.dataset.showing = showing ? "orig" : "syl";
      flash(entry); speak(word);
      return;
    }
    // speak zone
    flash(entry); speak(word);
  });

  // ---- wheel ----
  var wheelH=document.getElementById("wheelH"), wheelV=document.getElementById("wheelV");
  var rangeH=document.getElementById("rangeH"), rangeV=document.getElementById("rangeV");
  var wlabelH=document.getElementById("wlabelH");
  rangeH.min=rangeV.min=0; rangeH.max=rangeV.max=Math.max(0,pages.length-1);

  function goPage(p){
    p = Math.max(0, Math.min(pages.length-1, p));
    var pg = pagesEl.querySelector('.page[data-page="'+p+'"]');
    if(!pg) return;
    if(state.mode==="h") pagesEl.scrollTo({left:pg.offsetLeft, behavior:"auto"});
    else pagesEl.scrollTo({top:pg.offsetTop, behavior:"auto"});
    updatePageLabel();
  }
  rangeH.addEventListener("input", function(){ wlabelH.textContent="第 "+(+rangeH.value+1)+" / "+pages.length+" 页"; goPage(+rangeH.value); });
  rangeV.addEventListener("input", function(){ goPage(+rangeV.value); });

  pagenoEl.addEventListener("click", function(){
    if(state.mode==="h"){
      var v = wheelH.style.display==="block";
      wheelH.style.display = v?"none":"block"; wheelV.style.display="none";
    }else{
      var v2 = wheelV.style.display==="flex";
      wheelV.style.display = v2?"none":"flex"; wheelH.style.display="none";
    }
    updatePageLabel();
  });
  pagesEl.addEventListener("click", function(){ /* keep wheel; closed by tapping pageno */ }, true);

  // ---- settings ----
  var settingsEl=document.getElementById("settings");
  var swShow=document.getElementById("sw-showmarked");
  var segMode=document.getElementById("seg-mode");
  var segAccent=document.getElementById("seg-accent");

  function syncSettingsUI(){
    swShow.classList.toggle("on", state.showMarked);
    [].forEach.call(segMode.children, function(b){ b.classList.toggle("on", b.dataset.v===state.mode); });
    [].forEach.call(segAccent.children, function(b){ b.classList.toggle("on", b.dataset.v===state.accent); });
  }
  swShow.addEventListener("click", function(){ state.showMarked=!state.showMarked; syncSettingsUI(); save(); });
  segMode.addEventListener("click", function(ev){ var b=ev.target.closest("button"); if(!b)return; state.mode=b.dataset.v; syncSettingsUI(); save(); });
  segAccent.addEventListener("click", function(ev){ var b=ev.target.closest("button"); if(!b)return; state.accent=b.dataset.v; syncSettingsUI(); save(); });

  document.getElementById("start").addEventListener("click", function(){
    settingsEl.style.display="none";
    render();
  });
  document.getElementById("btn-settings").addEventListener("click", function(){
    syncSettingsUI();
    settingsEl.style.display="flex";
    wheelH.style.display="none"; wheelV.style.display="none";
  });

  // init
  syncSettingsUI();
  // pre-render behind settings so "开始背诵" is instant & state restored
  render();
})();
</script>
</body>
</html>
